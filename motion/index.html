<script>
// ───────────────────────── time + springs ─────────────────────────
const P = 14;                     // 7 bars at 120 BPM
const BLUE = [11, 84, 230];
const mix = (a, b, k) => a + (b - a) * k;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const col = (k, a = 1) => `rgba(${mix(255, BLUE[0], k)},${mix(255, BLUE[1], k)},${mix(255, BLUE[2], k)},${a})`; // k: 0 white → 1 blue
const B = 'rgb(11,84,230)', W = '#fff';
const bA = a => `rgba(11,84,230,${a})`, wA = a => `rgba(255,255,255,${a})`;

// closed-form step response of a damped spring (0 → 1)
function S(tau, w, z) {
  if (tau <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * tau);
  return 1 - e * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
}
// free response from offset x0 with velocity v0
function springOff(x0, v0, tau, w, z) {
  const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * tau);
  return e * (x0 * Math.cos(wd * tau) + ((v0 + z * w * x0) / wd) * Math.sin(wd * tau));
}
// A value that changes target many times = sum of one spring per change.
// Periodic: the previous loop's springs are included, so v(P) === v(0).
function track(keys, dw = 16, dz = 0.82) {
  keys = keys.slice().sort((a, b) => a[0] - b[0]);
  const last = keys[keys.length - 1][1];
  let prev = last;
  const ev = keys.map(k => { const o = k[2] || {}; const e = { t: k[0], d: k[1] - prev, w: o.w || dw, z: o.z || dz, j: !!o.jump }; prev = k[1]; return e; });
  const f = (e, x) => e.j ? (x >= 0 ? 1 : 0) : S(x, e.w, e.z);
  return t => { let v = last; for (const e of ev) v += e.d * (f(e, t - e.t) + f(e, t - e.t + P)); return v; };
}
// content enter/exit (its own timing, never shared with the container)
const vis = (tin, tout, wi = 30, wo = 42) => track([[tin, 1, { w: wi, z: .96 }], [tout, 0, { w: wo, z: .96 }]]);
const press = (...beats) => track(beats.flatMap(b => [[b - 0.07, 1, { w: 44, z: .9 }], [b, 0, { w: 26, z: .78 }]]));

// ───────────────────────── the shape ─────────────────────────
const SW = track([[0.5,120],[2.0,380],[2.5,440],[5.5,112],[8.0,176],[9.0,520,{w:22,z:.85}],[10.0,600],[12.0,260],[12.5,600],[13.0,400],[13.5,300]]);
const SH = track([[0.5,120],[2.0,80],[2.5,560],[5.5,440],[8.0,100],[9.0,92],[10.0,520],[12.0,80],[12.5,336],[12.75,216,{w:22,z:.85}],[13.0,84],[13.5,96]]);
const SR = track([[0.5,60],[2.0,40],[2.5,40],[5.5,36],[8.0,50],[9.0,46],[10.0,36],[12.0,40],[12.5,28],[13.0,42],[13.5,48]]);
const SF = track([[0.5,0],[1.5,1],[2.5,0],[8.0,0],[8.5,1],[12.0,0],[13.0,1],[13.5,1]], 30, .92);   // colour crosses fast: no washed-out midpoint

const RATE = 1 / 122;             // track is 2:02
function pBase(t) {               // playhead while playing (paused 3.0–3.5)
  let play = 0; for (const [a, b] of [[2.5, 3.0], [3.5, 4.0]]) play += clamp(t, a, b) - a;
  return 0.34 + play * RATE;
}
function prog(t) {
  const g = 4.0, rl = 5.0;
  if (t < g) return pBase(t);
  const pg = pBase(g), cg = CX(g);
  const held = tt => clamp(pg + (CX(tt) - cg) / 376, 0, 1);
  if (t < rl) return held(t);
  return held(rl) + (Math.min(t, 5.5) - rl) * RATE;
}
const SCRUB_HOLD = track([[3.95, 1, { w: 34, z: .85 }], [5.0, 0, { w: 20, z: .8 }]]);
const V0 = 0.45, VH = 440;
const rubber = over => 60 * (1 - Math.exp(-over / 60));
function vol(t) {                 // {v, s}: level, and overstretch in px
  const g = 6.0, rl = 7.5;
  if (t < g) return { v: V0, s: 0 };
  const cg = CY(g), raw = tt => V0 + (cg - CY(tt)) / VH, st = tt => rubber(Math.max(0, raw(tt) - 1) * VH);
  if (t < rl) return { v: clamp(raw(t), 0, 1), s: st(t) };
  const s0 = st(rl), v0 = (st(rl) - st(rl - 1 / 480)) * 480;   // release from wherever it was
  return { v: clamp(raw(rl), 0, 1), s: springOff(s0, v0, t - rl, 18, .8) };
}

 <defs><clipPath id="areaClip"><rect id="areaRect" x="-270" y="-40" width="0" height="260"/></clipPath></defs>

const typed = E(palTop, `left:-238px;top:40px;transform:translateY(-50%);display:flex;font-size:24px;font-weight:500;color:${B};line-height:1;white-space:pre`);
const chars = ['t', 'o', 'g'].map(ch => { const s = document.createElement('span'); s.textContent = ch; s.style.display = 'inline-block'; typed.appendChild(s); return s; });
const caret = E(palTop, `top:25px;width:2.5px;height:30px;border-radius:2px;background:${B}`);
E(palTop, `left:-300px;top:80px;width:600px;height:1px;background:${bA(.1)}`);
const ROWS = [['bell', 'Toggle notifications', '⌘N'], ['moon', 'Toggle dark mode', '⌘D'], ['sliders', 'Open settings', '⌘,'], ['plus', 'New project', '⌘P']];
const rows = ROWS.map(([ic, label, sc], i) => {
  const r = E(palTop, `left:-292px;top:${88 + i * 60 + 4}px;width:584px;height:52px;border-radius:14px;${i === 0 ? 'background:' + B : ''}`);
  const c = i === 0 ? '#fff' : B;
  at(r, 30, 26, 24, icon(ic, 24, c));
  txt(r, 60, 26, label, `font-size:20px;font-weight:${i === 0 ? 560 : 500};color:${c}`);
  txt(r, 562, 26, sc, `font-size:16px;font-weight:500;color:${i === 0 ? wA(.72) : bA(.5)}`, 'r');
  return r;
});
// toast
const lToast = layer();
at(lToast, -166, 0, 28, icon('checkc', 28, '#fff'));
txt(lToast, -138, 0, 'Notifications on', `font-size:22px;font-weight:560;color:#fff`);
txt(lToast, 172, 0, 'Undo', `font-size:18px;font-weight:560;color:${wA(.7)}`, 'r');

const $ = id => document.getElementById(id);
const shape = $('shape'), cam = $('cam'), cursor = $('cursor');
const arc = $('arc'), chk = $('chk'), line = $('line'), area = $('area'), areaRect = $('areaRect'), xhair = $('xhair'),
  hDot = $('hDot'), hRing = $('hRing'), endDot = $('endDot'), pg1 = $('pg1'), pg2 = $('pg2');

// chart paths (static)
(function () {
  let d = `M${PTS[0][0]},${PTS[0][1]}`;
  for (let i = 0; i < PTS.length - 1; i++) {
    const p0 = PTS[Math.max(i - 1, 0)], p1 = PTS[i], p2 = PTS[i + 1], p3 = PTS[Math.min(i + 2, PTS.length - 1)];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1} ${c2} ${p2}`;
  }
  line.setAttribute('d', d);
  area.setAttribute('d', d + ` L268,190 L-268,190 Z`);
  endDot.setAttribute('cx', PTS[11][0]); endDot.setAttribute('cy', PTS[11][1]);
})();
let CHARX = [];  // measured once fonts are ready (layout constant, not frame state)

// ───────────────────────── seek(t): every style from t ─────────────────────────
function fx(e, o, extra = '') {
  o = clamp(o, 0, 1);
  e.style.opacity = o;
  e.style.visibility = o < 0.003 ? 'hidden' : 'visible';
  const b = (1 - o) * 10;
  e.style.filter = b > 0.05 ? `blur(${b.toFixed(2)}px)` : 'none';
  e.style.transform = `${extra} scale(${0.96 + 0.04 * o})`;
}
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const lerpPts = (a, b, k) => a.map((p, i) => [mix(p[0], b[i][0], k), mix(p[1], b[i][1], k)]);
const poly = p => 'M' + p.map(q => q.join(',')).join('L') + 'Z';
const PAUSE = [[[-9, -11], [-3, -11], [-3, 11], [-9, 11]], [[3, -11], [9, -11], [9, 11], [3, 11]]];
const PLAY = [[[-7, -12], [3, -6.2], [3, 6.2], [-7, 12]], [[3, -6.2], [13, 0], [13, 0], [3, 6.2]]];

function seek(T) {
  const t = ((T % P) + P) % P;
  // camera
  const Z = Math.exp(ZL(t));
  cam.style.transform = `scale(${Z})`;
  // shape
  const V = vol(t), vh = VOL_HOLD(t), sOn = L_VOL(t) > 0.001 || (t > 5.5 && t < 8.2);
  const stretch = (t > 5.9 && t < 8.3) ? V.s : 0;
  let w = SW(t) - 0.2 * stretch + 6 * vh, h = SH(t) + stretch;
  const r = Math.min(SR(t), w / 2, h / 2), sc = SSc(t);
  const cy = -stretch / 2;
  Object.assign(shape.style, { left: `${-w / 2}px`, top: `${cy - h / 2}px`, width: `${w}px`, height: `${h}px`, borderRadius: `${r}px`,
    background: col(SF(t)), transform: `scale(${sc})` });
  shape.style.transformOrigin = '50% 50%';

  // button
  fx(lBtn, L_BTN(t));
  // loader
  fx(lLoad, L_LOAD(t), `rotate(${(t - 0.5) * 400}deg)`);
  const a = clamp(ARC(t), 0, 1); arc.setAttribute('stroke-dasharray', `${a} 2`); arc.style.opacity = a < 0.003 ? 0 : 1;
  // check
  fx(lChk, L_CHK(t));
  const ck = clamp(CHK(t), 0, 1); chk.setAttribute('stroke-dasharray', `${ck} 2`); chk.style.opacity = ck < 0.003 ? 0 : 1;
  // island
  fx(lIsl, L_ISL(t));
  bars.forEach((b, i) => { const hh = 8 + 18 * Math.abs(Math.sin(t * (7.1 + i * 1.7) + i * 1.3)); b.style.height = hh + 'px'; b.style.top = -hh / 2 + 'px'; });
  // player
  fx(lPly, L_PLY(t));
  const p = prog(t), hold = SCRUB_HOLD(t), th = 6 + 4 * hold, ks = 16 + 8 * hold;
  Object.assign(pTrack.style, { top: `${100 - th / 2}px`, height: `${th}px`, borderRadius: `${th / 2}px` });
  pFill.style.width = `${376 * p}px`;
  Object.assign(pKnob.style, { left: `${-188 + 376 * p - ks / 2}px`, top: `${100 - ks / 2}px`, width: `${ks}px`, height: `${ks}px` });
  tEl.textContent = fmt(p * 122);
  const m = clamp(PLAYM(t), -0.05, 1.05);
  const g = lerpPts(PLAY.flat(), PAUSE.flat(), m);
  pg1.setAttribute('d', poly(g.slice(0, 4))); pg2.setAttribute('d', poly(g.slice(4)));
  playBtn.style.transform = `scale(${1 - 0.07 * PLAY_PRESS(t)})`;
  vBtn.style.transform = `scale(${1 - 0.12 * VBTN_PRESS(t)})`;
  // volume slider (anchored to the shape's bottom edge)
  const lv = L_VOL(t);
  fx(lVol, lv); fx(lSpk, lv);
  const fillH = V.v * VH + Math.max(0, stretch) * (V.v > 0.999 ? 1 : 0);
  Object.assign(volFill.style, { left: `${-w / 2}px`, top: `${h / 2 - fillH}px`, width: `${w}px`, height: `${fillH + 2}px`,
    opacity: clamp(lv, 0, 1), visibility: lv < 0.003 ? 'hidden' : 'visible' });
  const pct = `${Math.round(V.v * 100)}%`;
  volLabel.textContent = pct; volFillLabel.textContent = pct;
  volLabel.style.top = `${-h / 2 + 44}px`;
  volFillLabel.style.top = `${-h / 2 + 44 - (h / 2 - fillH)}px`;
  volFillLabel.style.left = `${w / 2}px`;
  volFillLabel.style.filter = lVol.style.filter;
  spk.style.top = `${h / 2 - 48 - 14}px`;
  spk.style.transform = `scale(${1 - 0.12 * SPK_PRESS(t)})`;

  // knob → tab indicator
  const lk = L_KNOB(t), anchor = ANCH(t);
  const rowY = (t > 9.9 && t < 12.4) ? (-h / 2 + 46 + 40 * anchor) : 0;
  let L = KL(t), R = KR(t) + 8 * TOG_PRESS(t);
  const stretchK = Math.max(0, (R - L) - KNOM(t));
  const kh = KH(t) - 0.06 * stretchK - 3 * TAB_PRESS(t);
  Object.assign(knob.style, { left: `${L}px`, top: `${rowY - kh / 2}px`, width: `${Math.max(0, R - L)}px`, height: `${kh}px`, borderRadius: `${kh / 2}px`,
    background: col(clamp(KC(t), 0, 1)), opacity: clamp(lk, 0, 1), visibility: lk < 0.003 ? 'hidden' : 'visible',
    transform: `scale(${0.9 + 0.1 * clamp(lk, 0, 1)})` });
  knobIn.style.transform = `translate(${-L}px,${kh / 2}px)`;
  const lt = L_TABS(t);
  fx(lTabs, lt, `translateY(${rowY}px)`);
  knobIn.style.opacity = clamp(lt, 0, 1);
  const ch = L_CHART(t);
  Object.assign(tabTrack.style, { top: `${rowY - 46}px`, opacity: clamp(ch, 0, 1) * clamp(anchor, 0, 1), visibility: ch < 0.003 ? 'hidden' : 'visible' });
  // chart
  fx(lChart, ch);
  const d = clamp(DRAW(t), 0, 1);
  line.setAttribute('stroke-dasharray', `${d} 2`); line.style.opacity = d < 0.003 ? 0 : 1;
  areaRect.setAttribute('width', 540 * d);
  area.style.opacity = clamp(AREA(t), 0, 1);
  const ed = clamp(ENDDOT(t), 0, 1.2); endDot.setAttribute('r', 6 * ed); endDot.style.opacity = ed > 0.01 ? 1 : 0;
  chVal.textContent = '$' + Math.round(48210 * clamp(d, 0, 1)).toLocaleString('en-US');
  const tv = clamp(TIP(t), 0, 1);
  const tx = clamp(TIPX(t), -268, 268), ty = TIPY(t);
  xhair.setAttribute('x1', tx); xhair.setAttribute('x2', tx); xhair.setAttribute('y1', ty + 14); xhair.style.opacity = tv;
  hDot.setAttribute('cx', tx); hDot.setAttribute('cy', ty); hRing.setAttribute('cx', tx); hRing.setAttribute('cy', ty);
  hDot.style.opacity = tv; hRing.style.opacity = tv;
  hDot.setAttribute('r', 7 * (0.6 + 0.4 * tv)); hRing.setAttribute('r', 13 * (0.6 + 0.4 * tv));
  const sn = snapAt(t), since = t - sn[0];
  tipIn.innerHTML = `<span style="color:${bA(.5)};font-weight:500">${MON[sn[1]]}</span>&nbsp;&nbsp;$${VAL[sn[1]].toFixed(1)}k`;
  const swap = SNAPS.indexOf(sn) > 0 ? 1 - clamp(S(since, 40, .95), 0, 1) : 0;
  tipIn.style.filter = swap > 0.02 ? `blur(${4 * swap}px)` : 'none'; tipIn.style.opacity = 1 - 0.6 * swap;
  const tipX = clamp(tx, -300 + 96, 300 - 96);
  Object.assign(tip.style, { left: `${tipX}px`, top: `${ty - 22}px`, opacity: tv, visibility: tv < 0.003 ? 'hidden' : 'visible',
    transform: `translate(-50%,-100%) translateY(${6 * (1 - tv)}px) scale(${0.94 + 0.06 * tv})`, filter: tv < 0.98 ? `blur(${(1 - tv) * 6}px)` : 'none' });
  hint.style.transform = `scale(${1 - 0.1 * HINT_PRESS(t)})`;
  // ⌘K
  fx(lCmdk, L_CMDK(t));
  kbd.style.transform = `scale(${1 - 0.1 * KBD_PRESS(t)})`;
  // palette (anchored to the top edge)
  fx(lPal, L_PAL(t));
  palTop.style.top = `${-h / 2}px`;
  let cx = -238; const firstChar = CHAR[0](t);
  chars.forEach((s, i) => { const o = clamp(CHAR[i](t), 0, 1); s.style.opacity = o; s.style.filter = o < 0.98 ? `blur(${(1 - o) * 5}px)` : 'none';
    if (t >= TYPED[i] && t < 13.1) cx = -238 + CHARX[i + 1]; });
  ph.style.opacity = t >= TYPED[0] && t < 13.1 ? 0 : 1;
  caret.style.left = `${cx + 1}px`;
  caret.style.opacity = (Math.floor((t - 12.5) * 4) % 2 === 0 || (t > 12.6 && t < 13)) ? 1 : 0;
  rows.forEach((rw, i) => { if (ROWVIS[i]) fx(rw, ROWVIS[i](t)); });
  rows[0].style.transform = `scale(${1 - 0.025 * ROW_PRESS(t)})`;
  // toast
  fx(lToast, L_TOAST(t));
  // cursor (screen space, constant size)
  const x = CX(t), y = CY(t), cp = CP(t);
  cursor.style.transform = `translate(${720 + x * Z - 2}px,${720 + y * Z - 2}px) scale(${1 - 0.14 * cp})`;
  return t;
}

// sound cue list, derived from the same pure functions
function sounds() {
  const s = [];
  const add = (t, type, gain = 1) => s.push({ t: +t.toFixed(4), type, gain });
  CLICKS.forEach(c => add(c, 'click'));
  add(1.0, 'tick', .7); add(1.5, 'pop'); add(2.0, 'thump'); add(9.0, 'thump'); add(10.0, 'thump');
  add(4.0, 'grab'); add(5.0, 'release'); add(6.0, 'grab'); add(7.5, 'release');
  add(10.5, 'tick', .8); add(11.0, 'tick', .8);
  add(8.5, 'pop', .6); add(13.0, 'enter'); add(13.06, 'pop', .8);
  add(12.5, 'key', .9); TYPED.forEach(k => add(k, 'key', .8));
  let last = Math.floor(prog(4.0) * 40);
  for (let t = 4.0; t < 5.0; t += 1 / 960) { const k = Math.floor(prog(t) * 40); if (k !== last) { add(t, 'tick', .35); last = k; } }
  last = Math.floor(vol(6.0).v * 10);
  for (let t = 6.0; t < 7.5; t += 1 / 960) { const k = Math.floor(vol(t).v * 10 + 1e-9); if (k !== last) { add(t, k >= 10 ? 'tick' : 'tick', k >= 10 ? 1 : .45); last = k; } }
  SNAPS.slice(1).forEach(([t]) => add(t, 'tick', .45));
  return s.sort((a, b) => a.t - b.t);
}

window.ready = document.fonts.ready.then(() => {
  // measure caret stops once
  seek(12.95);
  const z = Math.exp(ZL(12.95)); let a2 = 0; CHARX = [0];
  chars.forEach(c => { c.style.opacity = 1; a2 += c.getBoundingClientRect().width / z; CHARX.push(a2); });
  seek(0);
  return document.fonts.check('30px Geist');
});
window.seek = seek; window.sounds = sounds; window.P = P;
</script>
